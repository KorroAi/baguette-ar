<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b0b12" />
  <title>Baguette AR</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b12'/%3E%3Cpath d='M5 22 C 11 6, 17 6, 17 16 S 24 26, 27 9' fill='none' stroke='%23ff2e88' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Dégradé arc-en-ciel réutilisé par les icônes -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="rbgrad" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#ff2e88" />
        <stop offset="0.25" stop-color="#ffe600" />
        <stop offset="0.5" stop-color="#39ff14" />
        <stop offset="0.75" stop-color="#00e5ff" />
        <stop offset="1" stop-color="#b14cff" />
      </linearGradient>
      <linearGradient id="irisgrad" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#a8f0ff" />
        <stop offset="0.35" stop-color="#f3b8ff" />
        <stop offset="0.65" stop-color="#fff3a8" />
        <stop offset="1" stop-color="#b8ffd9" />
      </linearGradient>
      <linearGradient id="feugrad" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#ff2e00" />
        <stop offset="0.5" stop-color="#ffb000" />
        <stop offset="1" stop-color="#ff4d00" />
      </linearGradient>
      <linearGradient id="auroregrad" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#1affa0" />
        <stop offset="0.5" stop-color="#339cff" />
        <stop offset="1" stop-color="#b44dff" />
      </linearGradient>
      <linearGradient id="orgrad" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0" stop-color="#8a5a12" />
        <stop offset="0.5" stop-color="#ffe08a" />
        <stop offset="1" stop-color="#a8741c" />
      </linearGradient>
    </defs>
  </svg>

  <!-- Écran d'accueil -->
  <main id="home">
    <div class="home-inner">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 120 60"><path d="M8 44 C 30 4, 52 4, 60 30 S 92 56, 112 14" /></svg>
      </div>
      <h1>Baguette&nbsp;AR</h1>
      <p class="lead">Dessine avec ton doigt dans l'air de ta pièce ou directement sur les murs et les objets. Les traits restent en place, tu peux tourner autour.</p>
      <button id="btn-ar" class="primary" disabled>Vérification…</button>
      <button id="btn-preview" class="ghost">Aperçu 3D sans AR</button>
      <p id="support-msg" class="small"></p>
    </div>
  </main>

  <!-- Interface en surimpression (DOM overlay WebXR) -->
  <div id="overlay" class="hidden">
    <div class="topbar ui">
      <button id="btn-exit" class="icon-btn" aria-label="Quitter">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
      <button id="btn-surface" class="pill-btn" aria-label="Dessiner sur les surfaces">
        <svg viewBox="0 0 24 24"><path d="M3 17l9 4 9-4M3 12l9 4 9-4" /><path d="M3 7l9-4 9 4-9 4z" /></svg>
        <span>Surface</span>
      </button>
      <div class="spacer"></div>
      <button id="btn-undo" class="icon-btn" aria-label="Annuler">
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5" /><path d="M4 9h10a6 6 0 010 12h-3" /></svg>
      </button>
      <button id="btn-clear" class="icon-btn" aria-label="Tout effacer">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" /></svg>
      </button>
      <button id="btn-hide" class="icon-btn keep" aria-label="Masquer l'interface">
        <svg class="eye-open" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></svg>
        <svg class="eye-closed" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10 10 0 0112 5c6 0 10 7 10 7a17 17 0 01-3.2 3.9M6.6 6.6C3.8 8.4 2 12 2 12s4 7 10 7c1.8 0 3.4-.6 4.8-1.4" /></svg>
      </button>
    </div>

    <div id="hint" class="hint"></div>

    <section id="panel" class="panel ui" data-tab="brush">
      <div class="tab-content" data-for="brush"><div class="row" id="brush-row"></div></div>
      <div class="tab-content" data-for="color"><div class="row" id="color-row"></div></div>
      <div class="tab-content" data-for="shape"><div class="row" id="shape-row"></div></div>
      <div class="tab-content" data-for="settings">
        <label class="slider"><span>Épaisseur</span><input id="sl-size" type="range" min="1" max="20" step="1" /><output id="out-size"></output></label>
        <label class="slider"><span>Distance</span><input id="sl-dist" type="range" min="10" max="80" step="1" /><output id="out-dist"></output></label>
        <label class="slider"><span>Taille forme</span><input id="sl-shape" type="range" min="5" max="80" step="1" /><output id="out-shape"></output></label>
        <label class="slider"><span>Réalisme surface</span><input id="sl-real" type="range" min="0" max="100" step="5" /><output id="out-real"></output></label>
        <label class="check"><input id="chk-flip" type="checkbox" /><span>Inverser la texture caméra (si la peinture montre un reflet à l'envers)</span></label>
      </div>
      <nav class="tabs">
        <button data-tab="brush">Pinceaux</button>
        <button data-tab="color">Couleurs</button>
        <button data-tab="shape">Formes</button>
        <button data-tab="settings">Réglages</button>
      </nav>
    </section>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
